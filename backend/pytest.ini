[pytest]
# Scoped to tests/ deliberately -- backend/test_endpoints.py,
# test_db_connection.py, test_routes.py, and app/main_test.py are older
# ad-hoc manual scripts (they hit a live DB / make real HTTP requests at
# import time), not pytest tests. Without this, pytest's default
# test_*.py discovery would try to collect and execute them too.
testpaths = tests
asyncio_mode = auto
# One event loop for the whole test session, not a fresh one per test.
# The async engine/connection pool in conftest.py is created once and
# reused across tests -- asyncpg connections are bound to the loop they
# were created on, so a per-test loop (pytest-asyncio's default) corrupts
# the pool after the first test with "another operation is in progress"
# errors that have nothing to do with the test logic itself. Both knobs
# are needed: fixture_loop_scope alone leaves test *bodies* running on a
# fresh per-function loop (pytest-asyncio 1.x splits these), which still
# corrupts the pool the same way.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = .
