name: Deploy VaakSiddhi Backend

on:
  push:
    branches:
      - staging

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: vaaksudhicr
  ACR_LOGIN_SERVER: vaaksudhicr.azurecr.io
  IMAGE_NAME: vaaksudhi-backend
  RESOURCE_GROUP: vaaksudhi-rg
  CONTAINER_APP_NAME: vaaksudhi-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Download Vosk models
        working-directory: backend
        run: |
          mkdir -p vosk_models

          echo "Downloading small Hindi Vosk model..."
          wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-hi-0.22.zip -O /tmp/vosk-hi.zip
          unzip -q /tmp/vosk-hi.zip -d vosk_models
          rm /tmp/vosk-hi.zip

          echo "Downloading Telugu Vosk model..."
          wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-te-0.42.zip -O /tmp/vosk-te.zip
          unzip -q /tmp/vosk-te.zip -d vosk_models
          rm /tmp/vosk-te.zip

          echo "Downloading Kannada Vosk model..."
          wget -q --show-progress https://alphacephei.com/vosk/models/vosk-model-small-ka-0.42.zip -O /tmp/vosk-ka.zip
          unzip -q /tmp/vosk-ka.zip -d vosk_models
          rm /tmp/vosk-ka.zip

          echo "Vosk models available for Docker build:"
          du -sh vosk_models/*
          echo "Total Vosk model size:"
          du -sh vosk_models

      - name: Copy assessment word images into Docker build context
        # The Docker build context below is ./backend, so the Dockerfile's
        # `COPY data ./data` can only ever see backend/data -- it has no
        # visibility into the repo root, where the real assessment word
        # images actually live (data/images/, 48 files, tracked in git
        # despite the .gitignore entry -- force-added before that rule
        # existed). backend/data/images/ has nothing in it but a leftover
        # index.json, so every deployed image request 404's even though
        # the files are right there in the repo. Same shape of problem as
        # the Vosk models above, same fix: stage the real assets inside
        # the build context right before building.
        run: cp -v data/images/*.png backend/data/images/

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            ./backend

      - name: Push Docker image
        run: |
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Azure Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --set-env-vars CORS_ORIGINS=https://vaaksudhi.manaslearning.com GOOGLE_CLIENT_ID=1088227083197-50cv8i40hq4qcta48t2haf2o22klp53u.apps.googleusercontent.com