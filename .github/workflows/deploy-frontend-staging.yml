name: Deploy Frontend to Azure Static Web Apps

# See deploy-staging.yml for why this is workflow_dispatch-only now --
# lavanya2kowmar/agenti_ai's `staging` is the single deploy source for
# both frontend and backend; this repo's copy stays available for a
# manual trigger only.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_STATIC_WEB_APP_NAME: vaaksudhi-frontend
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: |
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
