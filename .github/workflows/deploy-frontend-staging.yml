name: Deploy Frontend to Azure Static Web Apps

on:
  push:
    branches:
      - staging
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend-staging.yml'

permissions:
  contents: read
  id-token: write

env:
  AZURE_STATIC_WEB_APP_NAME: vaaksudhi-frontend
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Same duplicate-repo issue as deploy-staging.yml: both
    # darayavahoush/agenti_ai and lavanya2kowmar/agenti_ai carry this file
    # and push to staging, so every push builds and deploys twice against
    # the same Azure Static Web App. Not secret-drift-prone the way the
    # backend's SMTP env vars were, but still two redundant builds racing
    # to deploy the same commit -- restrict to one canonical repo.
    #
    # Canonical repo switched from darayavahoush/agenti_ai to
    # lavanya2kowmar/agenti_ai on 2026-09-18, matching deploy-staging.yml.
    # lavanya2kowmar/agenti_ai needs its own AZURE_STATIC_WEB_APPS_API_TOKEN
    # secret before this takes effect -- Actions secrets don't carry over
    # between repos, so without it this job will run but fail at the
    # deploy step rather than silently no-op.
    if: github.repository == 'darayavahoush/agenti_ai'

    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build application
        working-directory: frontend
        run: |
          npm run build
          cp staticwebapp.config.json dist/staticwebapp.config.json

      - name: Deploy to Azure Static Web Apps
        uses: azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'frontend/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
